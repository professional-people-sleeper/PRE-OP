<!doctype html>
<html lang="th">
<head>

  <title>Anesth Pre-op Reports</title>
  <style>
    :root { color-scheme: light; }

           padding: 24px; background: #f4f7f6; color: #16243a;
           font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px 26px; border-radius: 20px;
           background: #fff; text-align: center; box-shadow: 0 8px 30px #152d4b15; }

    p { margin: 0 0 24px; color: #526173; line-height: 1.6; }
    a.button { display: block; padding: 16px 20px; background: #0d6efd;
               color: #fff; border-radius: 12px; text-decoration: none;
               font-size: 1.05rem; font-weight: 700; }
    a.button:hover, a.button:focus-visible { background: #0a58ca; }
    small { display: block; margin-top: 18px; color: #667588; line-height: 1.5; }

  <main>
    <h1>Anesth Pre-op Reports</h1>
